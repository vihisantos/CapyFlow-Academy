name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA"...HEAD -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint "${files[@]}"
          else
            echo "No changed TypeScript/TSX files to lint."
          fi

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  backend:
    name: Backend · NestJS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed_files < <(git -C .. diff --name-only "$BASE_SHA"...HEAD -- 'backend/**/*.ts')
          files=()
          for file in "${changed_files[@]}"; do
            files+=("${file#backend/}")
          done
          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint "${files[@]}"
          else
            echo "No changed backend TypeScript files to lint."
          fi

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build
